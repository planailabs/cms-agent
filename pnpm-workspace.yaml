allowBuilds:
  # Reached through notifme-sdk → node-pushnotifications → firebase-admin,
  # for the push channel this app does not use. None of their build scripts
  # produce anything we load, and the nix build never runs install scripts —
  # denying them keeps dev and the package identical.
  '@firebase/util': false
  '@prisma/client': set this to true or false
  '@prisma/engines': true
  better-sqlite3: true
  core-js: false
  esbuild: true
  farmhash: false
  prisma: true
  # Pulled in by the OTLP/grpc exporter. Its postinstall only rewrites paths
  # for the pbjs CLI, which nothing here runs — and the nix build never runs
  # install scripts, so denying it keeps dev and the package identical.
  protobufjs: false
  sharp: true
onlyBuiltDependencies:
  - esbuild
  - sharp
  - prisma
  - "@prisma/client"
  - "@prisma/engines"
  - better-sqlite3
