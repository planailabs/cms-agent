[package]
name = "cms-agent-proxy"
version = "0.1.0"
edition = "2021"
description = "Embedded Pingora server for the CMS"
publish = false

[lib]
name = "cms_agent_proxy"
crate-type = ["cdylib", "rlib"]

[dependencies]
pingora = { version = "0.6", features = ["proxy"] }
async-trait = "0.1"
bytes = "1"
http = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2"
napi = "3"
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
# Already in the tree through pingora; used directly for the proxy's own
# registry, which the CMS serves alongside its OpenTelemetry metrics.
prometheus = { version = "0.13", default-features = false }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
napi-build = "2"
