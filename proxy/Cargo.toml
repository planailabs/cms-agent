[package]
name = "cms-agent-proxy"
version = "0.1.0"
edition = "2021"
description = "Reverse-proxy sidecar for the CMS: routes by Host header, gates previews, injects the preview overlay"
publish = false

[dependencies]
pingora = { version = "0.6", features = ["proxy"] }
async-trait = "0.1"
bytes = "1"
http = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"
